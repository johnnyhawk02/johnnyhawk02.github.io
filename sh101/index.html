<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shyoy has moved</title>
<link rel="canonical" href="https://shyoy.pages.dev/">
<meta http-equiv="refresh" content="0; url=https://shyoy.pages.dev/">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#161815;color:#d8e6a0;font:16px/1.5 ui-monospace,Menlo,monospace;text-align:center;padding:16px}a{color:#e8f5b0}</style>
</head>
<body>
<p>Shyoy has moved to <a href="https://shyoy.pages.dev/">shyoy.pages.dev</a>.<br>Reinstall it from there.</p>
<script>
// Drop the old offline copy (only this app's worker and caches, other apps share this origin), then go to the new address.
(async () => {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter((r) => r.scope.endsWith('/sh101/')).map((r) => r.unregister()));
    }
    if ('caches' in self) {
      const ks = await caches.keys();
      await Promise.all(ks.filter((k) => k.startsWith('kestrel-')).map((k) => caches.delete(k)));
    }
  } catch (e) {}
  location.replace('https://shyoy.pages.dev/');
})();
</script>
</body>
</html>
