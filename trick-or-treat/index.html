<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a0b2e">
<meta name="mobile-web-app-capable" content="yes">
<title>Trick or Treat Talk Buttons</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Baloo 2", system-ui, sans-serif;
    background: linear-gradient(#1a0b2e, #3b1460);
    color: #fff;
    padding: calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px);
    display: flex; flex-direction: column; min-height: 100dvh;
    user-select: none; -webkit-user-select: none; overflow: hidden;
  }
  header { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
  header h1 { font-size: 20px; margin: 0; opacity: .9; }
  .hbtns { display: none; gap: 8px; }
  body.adult .hbtns { display: flex; }
  .hbtns button { white-space: nowrap; }
  header h1 { white-space: nowrap; }
  #voiceBtn { background: linear-gradient(#facc15, #f59e0b); color: #3b1460; border: none; border-radius: 14px;
    padding: 8px 14px; font-size: 16px; font-weight: 900; font-family: inherit; box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  #voices { position: fixed; inset: 0; z-index: 9; display: none; flex-direction: column;
    background: linear-gradient(#1a0b2e, #3b1460);
    padding: calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 12px); }
  #voices.open { display: flex; }
  #voices h2 { margin: 0 0 10px; text-align: center; font-size: 26px; }
  #vgrid { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-content: start; }
  .vt { border: none; border-radius: 22px; padding: 10px 4px 8px; font-family: inherit; color: #fff; font-weight: 900; font-size: 17px;
    display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: 0 6px 0 rgba(0,0,0,.35); transition: transform .08s; }
  .vt .ve { font-size: 46px; line-height: 1.1; }
  .vt small { font-size: 11px; font-weight: 600; opacity: .75; }
  .vt:active, .vt.playing { transform: translateY(4px) scale(.96); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .vt.on { outline: 5px solid #fff; outline-offset: -5px; }
    #vdone { margin-top: 12px; border: none; border-radius: 20px; padding: 18px; font-size: 24px; font-weight: 900; font-family: inherit;
    background: #fff; color: #3b1460; box-shadow: 0 6px 0 rgba(0,0,0,.35); }
  #trim { position: fixed; inset: 0; z-index: 11; display: none; flex-direction: column; gap: 12px;
    background: linear-gradient(#1a0b2e, #3b1460);
    padding: calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 14px); }
  #trim.open { display: flex; }
  #trim h2 { margin: 0; text-align: center; font-size: 24px; }
  #trim p { margin: 0; text-align: center; font-size: 14px; opacity: .85; }
  #wave { position: relative; height: 200px; border-radius: 18px; background: rgba(255,255,255,.08); touch-action: none; overflow: hidden; }
  #wave canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .shade { position: absolute; top: 0; bottom: 0; background: rgba(0,0,0,.55); pointer-events: none; }
  .handle { position: absolute; top: 0; bottom: 0; width: 44px; margin-left: -22px; touch-action: none; }
  .handle::before { content: ""; position: absolute; left: 20px; top: 0; bottom: 0; width: 4px; background: #facc15; border-radius: 2px; }
  .handle::after { content: ""; position: absolute; left: 8px; top: 50%; width: 28px; height: 44px; margin-top: -22px;
    background: #facc15; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
  #playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; display: none; pointer-events: none; }
  #trimTimes { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; opacity: .9; }
  .trow { display: flex; gap: 10px; }
  .trow button { flex: 1; border: none; border-radius: 16px; padding: 16px 8px; font-size: 19px; font-weight: 900; font-family: inherit; box-shadow: 0 5px 0 rgba(0,0,0,.35); }
  #tPlay { background: #22c55e; color: #fff; }
  #tAuto { background: rgba(255,255,255,.18); color: #fff; }
  #tSave { background: #fff; color: #3b1460; }
  #tCancel { background: rgba(255,255,255,.18); color: #fff; }
  #adultBtn {
    background: rgba(255,255,255,.12); color: #fff; border: 2px solid rgba(255,255,255,.3);
    border-radius: 14px; padding: 8px 12px; font-size: 14px; font-family: inherit;
  }
  #grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: minmax(0,1fr) minmax(0,1fr); gap: 12px; margin-top: 10px; }
  .card { position: relative; display: flex; flex-direction: column; min-height: 0; }
  .talk { min-height: 0; }
  .talk {
    flex: 1; border: none; border-radius: 28px; font-family: inherit; color: #fff;
    font-size: clamp(24px, 7.5vw, 40px); font-weight: 900; line-height: 1.05;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    box-shadow: 0 8px 0 rgba(0,0,0,.35), inset 0 -6px 0 rgba(0,0,0,.15);
    text-shadow: 0 3px 0 rgba(0,0,0,.3); transition: transform .08s;
    padding: 8px 8px 18px;
  }
  .talk .pic { background: transparent; width: 92%; flex: 1; min-height: 0; position: relative; }
  .talk .pic img { position: absolute; inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); object-fit: contain; pointer-events: none; filter: drop-shadow(0 0 2px rgba(255,255,255,.9)) drop-shadow(0 0 1px #fff); }
  .talk .emoji { font-size: clamp(56px, 20vw, 96px); text-shadow: none; }
  .talk:active, .talk.playing { transform: translateY(6px) scale(.97); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .talk.playing { animation: wiggle .35s ease-in-out infinite alternate; }
  @keyframes wiggle { from { rotate: -2deg; } to { rotate: 2deg; } }
  .c0 { background: linear-gradient(#ff9a1f, #e8590c); }
  .c1 { background: linear-gradient(#a855f7, #6d28d9); }
  .c2 { background: linear-gradient(#22c55e, #15803d); }
  .c3 { background: linear-gradient(#f43f5e, #be123c); }
  .rec { display: none; gap: 6px; margin-top: 6px; }
  body.adult .rec { display: flex; }
  .rec button {
    flex: 1; border: none; border-radius: 14px; padding: 12px 4px; font-size: 15px; font-weight: 700;
    font-family: inherit; background: #fff; color: #3b1460;
  }
  .rec button.recording { background: #ef4444; color: #fff; animation: pulse 1s infinite; }
  .rec .recBtn { white-space: nowrap; }
  .rec button.del { flex: 0 0 40px; background: rgba(255,255,255,.25); color: #fff; }
  @keyframes pulse { 50% { opacity: .6; } }
  .badge {
    position: absolute; top: 8px; right: 10px; font-size: 12px; background: rgba(0,0,0,.35);
    padding: 3px 8px; border-radius: 10px; display: none;
  }
  body.adult .badge { display: block; }
  #note { display: none; font-size: 13px; text-align: center; opacity: .85; margin-top: 8px; }
  body.adult #note { display: block; }
  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translateX(-50%);
    background: #fff; color: #3b1460; padding: 10px 16px; border-radius: 14px; font-size: 15px; font-weight: 700;
    opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; }
  #gate {
    position: fixed; inset: 0; background: rgba(10,0,20,.85); display: none; align-items: center; justify-content: center; z-index: 10;
  }
  #gate .box { background: #fff; color: #3b1460; border-radius: 20px; padding: 20px; width: min(320px, 90vw); text-align: center; }
  #gate .box p { margin: 0 0 12px; font-size: 18px; font-weight: 700; }
  #holdBtn {
    width: 100%; padding: 18px; border: none; border-radius: 14px; font-size: 18px; font-family: inherit; font-weight: 800;
    background: linear-gradient(90deg, #a855f7 var(--p,0%), #e9d5ff var(--p,0%)); color: #3b1460;
  }
  #gateCancel { margin-top: 10px; background: none; border: none; color: #6b7280; font-size: 15px; font-family: inherit; }
</style>
</head>
<body>
<header>
  <h1>🎃 Trick or Treat!</h1>
  <div class="hbtns"><button id="voiceBtn" style="display:none">🗣️ Voices</button><button id="adultBtn">✅ Done</button></div>
</header>

<div id="grid"></div>
<div id="note">Tap 🎙️ Record, speak, then tap ⏹ Stop and trim it. ✂️ re-trims. Hold anywhere for 3 seconds to get back here.</div>

<input type="file" id="fileIn" accept="audio/*" capture style="display:none">


<div id="voices">
  <h2>Pick a voice! 🗣️</h2>
  <div id="vgrid"></div>
  <button id="vdone">👍 Done</button>
</div>

<div id="trim">
  <h2 id="trimTitle">Trim your recording ✂️</h2>
  <p>Drag the yellow handles to the start and end of the words.</p>
  <div id="wave"><canvas id="wcv"></canvas>
    <div class="shade" id="shL"></div><div class="shade" id="shR"></div>
    <div id="playhead"></div>
    <div class="handle" id="hL"></div><div class="handle" id="hR"></div>
  </div>
  <div id="trimTimes"><span id="tS">0.0s</span><span id="tLen"></span><span id="tE">0.0s</span></div>
  <div class="trow"><button id="tPlay">▶️ Play</button><button id="tAuto">✨ Auto</button></div>
  <div class="trow"><button id="tCancel">Cancel</button><button id="tSave">💾 Save</button></div>
</div>

<div id="toast"></div>

<script>
const PHRASES = [
  { id: "trick", text: "Trick or treat!", emoji: "🎃", img: "img/trick.png", audio: "audio/trick.mp3" },
  { id: "boo",   text: "BOO!",            emoji: "👻", img: "img/boo.png", audio: "audio/boo.mp3" },
  { id: "thanks",text: "Thank you",       emoji: "🍬", img: "img/thanks.png", audio: "audio/thanks.mp3" },
  { id: "bye",   text: "Bye!",            emoji: "👋", img: "img/bye.png", audio: "audio/bye.mp3" },
];

// ---------- storage (IndexedDB, with in-memory fallback) ----------
const mem = {};
let dbp = null;
function openDB() {
  if (dbp) return dbp;
  dbp = new Promise((res) => {
    try {
      const r = indexedDB.open("talk-buttons", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("clips");
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
    } catch (e) { res(null); }
  });
  return dbp;
}
async function saveClip(id, blob) {
  mem[id] = blob;
  const db = await openDB(); if (!db) return false;
  return new Promise((res) => {
    try {
      const tx = db.transaction("clips", "readwrite");
      tx.objectStore("clips").put(blob, id);
      tx.oncomplete = () => res(true); tx.onerror = () => res(false);
    } catch (e) { res(false); }
  });
}
async function loadClip(id) {
  if (mem[id]) return mem[id];
  const db = await openDB(); if (!db) return null;
  return new Promise((res) => {
    try {
      const q = db.transaction("clips").objectStore("clips").get(id);
      q.onsuccess = () => { if (q.result) mem[id] = q.result; res(q.result || null); };
      q.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
async function deleteClip(id) {
  delete mem[id];
  const db = await openDB(); if (!db) return;
  try { db.transaction("clips", "readwrite").objectStore("clips").delete(id); } catch (e) {}
}

// ---------- UI ----------
const grid = document.getElementById("grid");
const toastEl = document.getElementById("toast");
let toastT;
function toast(msg, ms = 2200) {
  toastEl.textContent = msg; toastEl.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove("show"), ms);
}

PHRASES.forEach((p, i) => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <button class="talk c${i}" data-id="${p.id}">${p.img ? `<span class="pic"><img src="${p.img}" alt=""></span>` : `<span class="emoji">${p.emoji}</span>`}<span>${p.text}</span></button>
    <span class="badge" id="badge-${p.id}">starter voice</span>
    <div class="rec">
      <button class="recBtn" data-id="${p.id}">🎙️ Record</button>
      <button class="del trimBtn" data-id="${p.id}" title="Trim recording">✂️</button>
      <button class="del" data-id="${p.id}" title="Use starter voice">🗑️</button>
    </div>`;
  grid.appendChild(card);
});

async function refreshBadges() {
  for (const p of PHRASES) {
    const has = await loadClip(p.id);
    document.getElementById("badge-" + p.id).textContent = has ? "✅ your voice" : "starter voice";
  }
}

// ---------- playback ----------
let currentAudio = null, currentUrl = null;
function stopAll() {
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if (currentUrl) { URL.revokeObjectURL(currentUrl); currentUrl = null; }
  try { speechSynthesis.cancel(); } catch (e) {}
  document.querySelectorAll(".talk.playing").forEach(b => b.classList.remove("playing"));
}
function speak(text, btn) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95; u.pitch = 1.2; u.volume = 1;
    u.onend = u.onerror = () => btn.classList.remove("playing");
    speechSynthesis.speak(u);
  } catch (e) { btn.classList.remove("playing"); toast("No voice available — record one in Grown-up mode"); }
}
async function play(id, btn) {
  stopAll();
  btn.classList.add("playing");
  if (navigator.vibrate) navigator.vibrate(30);
  const p = PHRASES.find(x => x.id === id);
  const blob = await loadClip(id);
  if (blob) {
    currentUrl = URL.createObjectURL(blob);
    const a = new Audio(currentUrl);
    a.volume = 1;
    currentAudio = a;
    a.onended = () => btn.classList.remove("playing");
    a.play().catch(() => speak(p.text, btn));
  } else if (p.audio) {
    const a = new Audio(voiceSrc(p));
    currentAudio = a;
    a.onended = () => btn.classList.remove("playing");
    a.play().catch(() => speak(p.text, btn));
  } else {
    speak(p.text, btn);
  }
}
grid.addEventListener("click", (e) => {
  const talk = e.target.closest(".talk");
  if (talk) return play(talk.dataset.id, talk);
  const rec = e.target.closest(".recBtn");
  if (rec) return toggleRecord(rec.dataset.id, rec);
  const tb = e.target.closest(".trimBtn");
  if (tb) {
    const id = tb.dataset.id;
    return Promise.all([loadClip(id + ":raw"), loadClip(id)]).then(([raw, cur]) => {
      if (!raw && !cur) return toast("Record this one first 🎙️");
      openTrim(id, raw || cur, !raw);
    });
  }
  const del = e.target.closest(".del");
  if (del) { deleteClip(del.dataset.id + ":raw"); deleteClip(del.dataset.id).then(refreshBadges); toast("Back to the starter voice"); }
});

// ---------- starter voice choice ----------
let VOICES = [], voice = null;
function voiceSrc(p) { return voice ? `audio/${voice}/${p.id}.mp3` : p.audio; }
const CHARS = {
  alloy:   ["🎃", "Pumpkin", "#f97316"], ash:    ["🦇", "Bat",     "#6d28d9"], ballad: ["🦉", "Owl",     "#a16207"],
  coral:   ["🧚", "Fairy",   "#db2777"], echo:   ["👻", "Ghost",   "#64748b"], fable:  ["🧙", "Wizard",  "#4338ca"],
  nova:    ["⭐", "Star",    "#ca8a04"], onyx:   ["🐻", "Bear",    "#78350f"], sage:   ["🐱", "Cat",     "#15803d"],
  shimmer: ["🦄", "Unicorn", "#c026d3"], verse:  ["🐉", "Dragon",  "#b91c1c"], marin:  ["🧜", "Mermaid", "#0e7490"],
  cedar:   ["🦊", "Fox",     "#ea580c"],
};
function renderVoices() {
  const g = document.getElementById("vgrid");
  g.innerHTML = "";
  VOICES.forEach(v => {
    const [e, name, col] = CHARS[v] || ["🔊", v, "#7c3aed"];
    const b = document.createElement("button");
    b.className = "vt" + (v === voice ? " on" : "");
    b.style.background = col;
    b.innerHTML = `<span class="ve">${e}</span>${name}<small>${v}</small>`;
    b.onclick = () => {
      voice = v; try { localStorage.setItem("tot-voice", v); } catch (e) {}
      g.querySelectorAll(".vt").forEach(x => x.classList.remove("on", "playing"));
      b.classList.add("on", "playing");
      stopAll();
      const a = new Audio(`audio/${v}/trick.mp3`); currentAudio = a;
      a.onended = a.onerror = () => b.classList.remove("playing");
      a.play().catch(() => b.classList.remove("playing"));
    };
    g.appendChild(b);
  });
  document.getElementById("voiceBtn").style.display = VOICES.length ? "" : "none";
}
document.getElementById("voiceBtn").onclick = () => { renderVoices(); document.getElementById("voices").classList.add("open"); };
document.getElementById("vdone").onclick = () => { stopAll(); document.getElementById("voices").classList.remove("open"); };
fetch("audio/voices.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : []).then(list => {
  VOICES = Array.isArray(list) ? list : [];
  let saved = null; try { saved = localStorage.getItem("tot-voice"); } catch (e) {}
  voice = VOICES.includes(saved) ? saved : (VOICES.includes("nova") ? "nova" : (VOICES[0] || null));
  renderVoices();
}).catch(() => {});

// ---------- recording ----------
// Live microphone where allowed; otherwise the phone's own recorder via file picker.
let recorder = null, recId = null, recBtn = null, chunks = [], recTimer = null;
const fileIn = document.getElementById("fileIn");
let pickId = null;

function canLiveRecord() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder && window.isSecureContext);
}
function pickFile(id) {
  pickId = id; fileIn.value = ""; fileIn.click();
}
fileIn.addEventListener("change", async () => {
  const f = fileIn.files && fileIn.files[0];
  if (!f || !pickId) return;
  openTrim(pickId, f, true);
});

async function toggleRecord(id, btn) {
  if (recorder && recorder.state === "recording") {
    if (recId === id) recorder.stop();
    return;
  }
  stopAll();
  if (!canLiveRecord()) return pickFile(id);
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    toast("Opening the phone recorder instead…");
    return pickFile(id);
  }
  chunks = [];
  const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m));
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  recId = id; recBtn = btn;
  recorder.ondataavailable = (ev) => { if (ev.data && ev.data.size) chunks.push(ev.data); };
  recorder.onstop = async () => {
    clearTimeout(recTimer);
    stream.getTracks().forEach(t => t.stop());
    btn.classList.remove("recording"); btn.textContent = "🎙️ Record";
    const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
    recorder = null; recId = null;
    if (blob.size < 500) { toast("That was too short, try again"); return; }
    openTrim(id, blob, true);
  };
  recorder.start();
  btn.classList.add("recording"); btn.textContent = "⏹ Stop";
  recTimer = setTimeout(() => { if (recorder && recorder.state === "recording") recorder.stop(); }, 10000);
}


// ---------- trim editor ----------
let actx = null;
function getCtx() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; }
const T = { id: null, raw: null, buf: null, s: 0, e: 1, src: null, raf: null, isNew: false };
const wave = document.getElementById("wave"), wcv = document.getElementById("wcv");
const hL = document.getElementById("hL"), hR = document.getElementById("hR");

function silenceBounds(buf) {
  const d = buf.getChannelData(0), n = d.length, win = Math.max(1, Math.floor(buf.sampleRate * 0.02));
  let peak = 0; for (let i = 0; i < n; i++) { const a = Math.abs(d[i]); if (a > peak) peak = a; }
  const th = Math.max(0.02, peak * 0.12);
  let a = 0, b = n;
  for (let i = 0; i < n; i += win) { let m = 0; for (let j = i; j < Math.min(n, i + win); j++) m = Math.max(m, Math.abs(d[j])); if (m > th) { a = i; break; } }
  for (let i = n - win; i >= 0; i -= win) { let m = 0; for (let j = i; j < Math.min(n, i + win); j++) m = Math.max(m, Math.abs(d[j])); if (m > th) { b = i + win; break; } }
  const pad = buf.sampleRate * 0.12;
  return [Math.max(0, a - pad) / n, Math.min(n, b + pad) / n];
}
function drawWave() {
  const r = wave.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  wcv.width = r.width * dpr; wcv.height = r.height * dpr;
  const c = wcv.getContext("2d"), W = wcv.width, H = wcv.height, d = T.buf.getChannelData(0);
  c.clearRect(0, 0, W, H); c.fillStyle = "#c4b5fd";
  const step = d.length / W;
  let peak = 0.0001; for (let i = 0; i < d.length; i += 50) peak = Math.max(peak, Math.abs(d[i]));
  for (let x = 0; x < W; x++) {
    let mn = 0, mx = 0; const s0 = Math.floor(x * step), s1 = Math.floor((x + 1) * step);
    for (let i = s0; i < s1; i++) { const v = d[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
    const y1 = H / 2 - (mx / peak) * H * 0.45, y2 = H / 2 - (mn / peak) * H * 0.45;
    c.fillRect(x, y1, 1, Math.max(1, y2 - y1));
  }
}
function layout() {
  hL.style.left = (T.s * 100) + "%"; hR.style.left = (T.e * 100) + "%";
  const L = document.getElementById("shL"), R = document.getElementById("shR");
  L.style.left = "0"; L.style.width = (T.s * 100) + "%";
  R.style.left = (T.e * 100) + "%"; R.style.right = "0";
  const dur = T.buf.duration;
  document.getElementById("tS").textContent = (T.s * dur).toFixed(1) + "s";
  document.getElementById("tE").textContent = (T.e * dur).toFixed(1) + "s";
  document.getElementById("tLen").textContent = "length " + ((T.e - T.s) * dur).toFixed(1) + "s";
}
function drag(handle, which) {
  handle.addEventListener("pointerdown", (ev) => {
    ev.preventDefault(); handle.setPointerCapture(ev.pointerId); stopPreview();
    const move = (e2) => {
      const r = wave.getBoundingClientRect();
      let f = Math.min(1, Math.max(0, (e2.clientX - r.left) / r.width));
      const gap = 0.15 / T.buf.duration;
      if (which === "s") T.s = Math.min(f, T.e - gap); else T.e = Math.max(f, T.s + gap);
      layout();
    };
    const up = () => { handle.removeEventListener("pointermove", move); handle.removeEventListener("pointerup", up); handle.removeEventListener("pointercancel", up); };
    handle.addEventListener("pointermove", move); handle.addEventListener("pointerup", up); handle.addEventListener("pointercancel", up);
  });
}
drag(hL, "s"); drag(hR, "e");

function stopPreview() {
  if (T.src) { try { T.src.stop(); } catch (e) {} T.src = null; }
  cancelAnimationFrame(T.raf); document.getElementById("playhead").style.display = "none";
  document.getElementById("tPlay").textContent = "▶️ Play";
}
document.getElementById("tPlay").onclick = () => {
  if (T.src) return stopPreview();
  const ctx = getCtx(); ctx.resume();
  const src = ctx.createBufferSource(); src.buffer = T.buf; src.connect(ctx.destination);
  const off = T.s * T.buf.duration, len = (T.e - T.s) * T.buf.duration, t0 = ctx.currentTime;
  src.start(0, off, len); T.src = src;
  src.onended = () => { if (T.src === src) stopPreview(); };
  document.getElementById("tPlay").textContent = "⏹ Stop";
  const ph = document.getElementById("playhead"); ph.style.display = "block";
  const tick = () => { const f = T.s + ((ctx.currentTime - t0) / T.buf.duration); ph.style.left = (Math.min(f, T.e) * 100) + "%"; T.raf = requestAnimationFrame(tick); };
  tick();
};
document.getElementById("tAuto").onclick = () => { stopPreview(); [T.s, T.e] = silenceBounds(T.buf); layout(); };

function toWav(buf, s, e) {
  const sr = buf.sampleRate, a = Math.floor(s * buf.length), b = Math.floor(e * buf.length), n = b - a;
  const chs = buf.numberOfChannels, mix = new Float32Array(n);
  for (let c = 0; c < chs; c++) { const d = buf.getChannelData(c); for (let i = 0; i < n; i++) mix[i] += d[a + i] / chs; }
  const fade = Math.min(n / 2, Math.floor(sr * 0.01));
  for (let i = 0; i < fade; i++) { mix[i] *= i / fade; mix[n - 1 - i] *= i / fade; }
  const ab = new ArrayBuffer(44 + n * 2), v = new DataView(ab);
  const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) { const x = Math.max(-1, Math.min(1, mix[i])); v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true); }
  return new Blob([ab], { type: "audio/wav" });
}
function closeTrim() { stopPreview(); document.getElementById("trim").classList.remove("open"); }
document.getElementById("tCancel").onclick = async () => {
  closeTrim();
  if (T.isNew) { // keep the untrimmed recording rather than losing it
    await saveClip(T.id + ":raw", T.raw); await saveClip(T.id, T.raw); await refreshBadges();
    toast("Saved without trimming");
  }
};
document.getElementById("tSave").onclick = async () => {
  closeTrim();
  const out = toWav(T.buf, T.s, T.e);
  await saveClip(T.id + ":raw", T.raw);
  const ok = await saveClip(T.id, out);
  await refreshBadges();
  toast(ok ? "Saved! 🎉 Tap the big button to hear it" : "Saved for now (this browser may not keep it)");
};
async function openTrim(id, blob, isNew) {
  T.id = id; T.raw = blob; T.isNew = isNew;
  try {
    const ab = await blob.arrayBuffer();
    T.buf = await getCtx().decodeAudioData(ab);
  } catch (e) {
    await saveClip(id + ":raw", blob); await saveClip(id, blob); await refreshBadges();
    return toast("Saved! (couldn't show the trimmer for this file)");
  }
  const p = PHRASES.find(x => x.id === id);
  document.getElementById("trimTitle").textContent = "Trim “" + p.text + "” ✂️";
  document.getElementById("trim").classList.add("open");
  [T.s, T.e] = isNew ? silenceBounds(T.buf) : [0, 1];
  requestAnimationFrame(() => { drawWave(); layout(); });
}

// ---------- grown-up gate (press and hold so the child doesn't wander in) ----------
document.getElementById("adultBtn").addEventListener("click", () => setAdult(false));

// Long-press anywhere (3 s, finger kept still) opens grown-up settings.
let lpT = null, lpHint = null, lpX = 0, lpY = 0, swallowClick = false;
function lpCancel() { clearTimeout(lpT); clearTimeout(lpHint); lpT = lpHint = null; }
document.addEventListener("pointerdown", (e) => {
  if (document.body.classList.contains("adult")) return;
  if (document.querySelector("#voices.open, #trim.open")) return;
  lpX = e.clientX; lpY = e.clientY; lpCancel();
  lpHint = setTimeout(() => toast("Keep holding for grown-up settings…", 2000), 1200);
  lpT = setTimeout(() => {
    lpCancel(); swallowClick = true; stopAll();
    if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
    setAdult(true); toast("Grown-up settings 🔓");
  }, 3000);
}, true);
document.addEventListener("pointermove", (e) => { if (lpT && Math.hypot(e.clientX - lpX, e.clientY - lpY) > 20) lpCancel(); }, true);
["pointerup", "pointercancel"].forEach(ev => document.addEventListener(ev, lpCancel, true));
document.addEventListener("click", (e) => { if (swallowClick) { swallowClick = false; e.stopPropagation(); e.preventDefault(); } }, true);

function setAdult(on) {
  document.body.classList.toggle("adult", on);
  document.getElementById("adultBtn").textContent = "✅ Done";
  if (on) refreshBadges();
}

// keep screen from sleeping while open, where allowed
async function wake() { try { if (navigator.wakeLock) await navigator.wakeLock.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wake(); });
wake();
refreshBadges();
if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {} }
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
document.addEventListener("contextmenu", e => e.preventDefault());
</script>
