<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hop Hop Runner</title>
<meta name="description" content="A jump-only 3D runner for kids: hop over everything, swerve round trains, grab coins.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hop Hop">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#8fd8ff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%238fd8ff'/><circle cx='16' cy='16' r='8' fill='%23ffd23f'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap">
<style>
  /* Layout: one full-screen canvas; HUD pinned top corners; overlays centred over the track. Single bright "sunny playground" look, chosen on purpose for both host themes. */
  :root {
    --sky: #8fd8ff;
    --ink: #2b2350;
    --sun: #ffd23f;
    --coral: #ff5d73;
    --cream: #fffaf0;
    --shadow: rgba(43, 35, 80, 0.28);
    --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    --body: "Nunito", "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--sky);
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .hud {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: max(16px, env(safe-area-inset-left, 0px));
    right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    pointer-events: none;
  }
  .pill {
    font-family: var(--display);
    font-size: clamp(22px, 4vw, 34px);
    letter-spacing: 0.02em;
    background: var(--cream);
    color: var(--ink);
    padding: 6px 18px 4px;
    border-radius: 999px;
    box-shadow: 0 4px 0 var(--shadow);
    font-variant-numeric: tabular-nums;
  }
  .hud-left, .hud-right { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .hud-right { justify-content: flex-end; }
  .board-icon {
    display: inline-block;
    width: 1.1em; height: 0.38em;
    margin-right: 8px;
    vertical-align: 0.12em;
    border-radius: 999px;
    background: linear-gradient(90deg, #ff5dc8, #5ee7ff);
    box-shadow: 0 3px 0 #5ee7ff88;
  }
  #boardPill { background: #e9fbff; }
  #boardPill.low { animation: pop 0.5s ease-out infinite; }
  .sound-btn {
    pointer-events: auto;
    border: 0;
    cursor: pointer;
    font: inherit;
    font-family: var(--display);
    font-size: clamp(16px, 2.6vw, 22px);
    background: var(--cream);
    color: var(--ink);
    padding: 9px 16px 7px;
    border-radius: 999px;
    box-shadow: 0 4px 0 var(--shadow);
    touch-action: manipulation;
  }
  .sound-btn:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
  .coin-icon {
    display: inline-block;
    width: 0.8em; height: 0.8em;
    margin-right: 6px;
    vertical-align: -0.08em;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff4b0, var(--sun) 45%, #e0a800);
    border: 3px solid #c78a00;
    box-sizing: border-box;
  }
  .pill.pop { animation: pop 0.25s ease-out; }
  @keyframes pop { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }
  #flash {
    position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at center, #ffffff 0%, #e6c8ff 45%, #9b5de5 100%);
  }
  #toast {
    position: fixed; left: 0; right: 0; top: 28%;
    text-align: center; pointer-events: none;
    font-family: var(--display); font-size: clamp(44px, 9vw, 90px);
    color: var(--sun); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill;
    text-shadow: 0 5px 0 var(--ink);
    opacity: 0; transform: scale(0.8);
    transition: opacity 0.3s, transform 0.3s;
  }
  #toast.show { opacity: 1; transform: scale(1); }
  .pill small { font-family: var(--body); font-weight: 900; font-size: 0.5em; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.6; margin-left: 4px; }

  .overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
    background: radial-gradient(ellipse at center, rgba(255, 250, 240, 0.35), rgba(43, 35, 80, 0.18));
    touch-action: none;
  }
  .card {
    display: grid;
    justify-items: center;
    gap: 14px;
    text-align: center;
    max-width: 34rem;
  }
  .card h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(56px, 12vw, 120px);
    line-height: 0.9;
    color: var(--sun);
    -webkit-text-stroke: 3px var(--ink);
    paint-order: stroke fill;
    text-shadow: 0 6px 0 var(--ink);
    text-wrap: balance;
    transform: rotate(-3deg);
  }
  .card h2 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(44px, 9vw, 84px);
    color: var(--coral);
    -webkit-text-stroke: 3px var(--ink);
    paint-order: stroke fill;
    text-shadow: 0 5px 0 var(--ink);
  }
  .go {
    font-family: var(--display);
    font-size: clamp(28px, 5vw, 44px);
    background: var(--coral);
    color: var(--cream);
    border: 4px solid var(--ink);
    border-radius: 999px;
    padding: 10px 42px 6px;
    box-shadow: 0 6px 0 var(--ink);
    animation: bob 1.1s ease-in-out infinite;
  }
  .hint {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin: 4px 0 0;
    padding: 0;
    list-style: none;
  }
  .hint li {
    background: var(--cream);
    border-radius: 14px;
    padding: 8px 14px;
    font-weight: 900;
    font-size: clamp(15px, 2.4vw, 20px);
    box-shadow: 0 3px 0 var(--shadow);
  }
  .score-line { font-weight: 900; font-size: clamp(18px, 3vw, 26px); margin: 0; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .go { animation: none; } }
</style>

<div id="game"></div>

<div class="hud">
  <div class="hud-left">
    <div class="pill" id="score">0<small>m</small></div>
    <div class="pill" id="coins"><span class="coin-icon"></span>0</div>
    <div class="pill" id="boardPill" hidden><span class="board-icon"></span>20</div>
  </div>
  <div class="hud-right">
    <button class="sound-btn" id="soundBtn" type="button" aria-pressed="true">Sound on</button>
    <div class="pill" id="best">0<small>best</small></div>
  </div>
</div>

<div id="flash"></div>
<div id="toast"></div>

<div class="overlay" id="startScreen">
  <div class="card">
    <h1>Hop Hop Runner</h1>
    <ul class="hint">
      <li>Swipe ← → to change lanes</li>
      <li>Tap or swipe ↑ to jump</li>
      <li>Grab coins, find the portal, and don't let the policeman catch you!</li>
      <li>A hoverboard saves you from one bump</li>
    </ul>
    <div class="go">Tap to run!</div>
  </div>
</div>

<div class="overlay" id="crashScreen" hidden>
  <div class="card">
    <h2 id="crashTitle">Bonk!</h2>
    <p class="score-line" id="crashScore">You ran 0 metres</p>
    <div class="go">Run again!</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
(() => {
  // ---------- tuning ----------
  const LANES = [-2.4, 0, 2.4];
  const START_SPEED = 10;      // world units per second
  const MAX_SPEED = 17;        // kept gentle for little players
  const SPEED_RAMP = 0.08;     // speed gained per second of running
  const GRAVITY = 26;
  const JUMP_V = 10;           // peak ≈ 1.9 units, every obstacle is ≤ 1.0 tall
  const SPAWN_Z = -110;
  const DESPAWN_Z = 12;

  // ---------- sound effects, synthesised with Web Audio ----------
  const sfx = (() => {
    let ctx = null, master = null, noiseBuf = null, hum = null;
    let on = true;
    try { on = localStorage.getItem('hopRunnerSound') !== 'off'; } catch (e) {}
    function unlock() {
      // iPad Safari only lets sound start inside a tap
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = on ? 0.55 : 0;
        master.connect(ctx.destination);
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ctx.state === 'suspended') ctx.resume();
    }
    function tone(type, f0, f1, dur, vol = 0.3, delay = 0) {
      if (!ctx || !on) return;
      const t = ctx.currentTime + delay;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t);
      if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + dur + 0.05);
    }
    function noise(dur, freq, vol = 0.3, q = 1, type = 'bandpass', delay = 0) {
      if (!ctx || !on) return;
      const t = ctx.currentTime + delay;
      const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      src.buffer = noiseBuf;
      f.type = type; f.frequency.value = freq; f.Q.value = q;
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t); src.stop(t + dur + 0.05);
    }
    return {
      unlock,
      get on() { return on; },
      toggle() {
        on = !on;
        try { localStorage.setItem('hopRunnerSound', on ? 'on' : 'off'); } catch (e) {}
        if (master) master.gain.value = on ? 0.55 : 0;
        if (!on) this.hum(false);
        return on;
      },
      jump() { tone('square', 330, 660, 0.14, 0.12); },
      lane() { noise(0.12, 1400, 0.12, 0.8); },
      coin() { tone('sine', 988, 988, 0.08, 0.22); tone('sine', 1319, 1319, 0.22, 0.22, 0.07); },
      bounce() { tone('sine', 180, 720, 0.35, 0.3); },
      launch() { noise(0.4, 900, 0.18, 0.6); tone('triangle', 300, 900, 0.35, 0.15); },
      stumble() { noise(0.18, 220, 0.5, 0.7, 'lowpass'); tone('triangle', 420, 160, 0.35, 0.2, 0.03); },
      whistle() { for (let k = 0; k < 4; k++) tone('square', k % 2 ? 2100 : 2500, k % 2 ? 2100 : 2500, 0.11, 0.07, k * 0.11); },
      bonk() { noise(0.3, 160, 0.6, 0.8, 'lowpass'); tone('sine', 300, 70, 0.5, 0.35); },
      caught() { this.whistle(); tone('sawtooth', 500, 200, 0.6, 0.08, 0.5); },
      portal() { tone('sine', 300, 1600, 0.7, 0.2); tone('triangle', 450, 2400, 0.7, 0.12, 0.08); noise(0.7, 3000, 0.08, 0.5, 'highpass'); },
      boardGet() { [523, 659, 784, 1047].forEach((f, k) => tone('triangle', f, f, 0.14, 0.18, k * 0.07)); },
      boardBreak() { noise(0.35, 1800, 0.4, 0.6); tone('square', 600, 120, 0.3, 0.1); },
      hum(start) {
        if (!ctx) return;
        if (start && on && !hum) {
          const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'sawtooth'; o.frequency.value = 70;
          o2.type = 'sine'; o2.frequency.value = 140;
          const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 400;
          g.gain.value = 0.05;
          o.connect(f); o2.connect(f); f.connect(g); g.connect(master);
          o.start(); o2.start();
          hum = { o, o2, g };
        } else if (!start && hum) {
          const h = hum; hum = null;
          h.g.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.05);
          h.o.stop(ctx.currentTime + 0.3); h.o2.stop(ctx.currentTime + 0.3);
        }
      },
    };
  })();

  // ---------- renderer / scene ----------
  const mount = document.getElementById('game');
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  mount.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const SKY = 0x8fd8ff;
  scene.background = new THREE.Color(SKY);
  scene.fog = new THREE.Fog(SKY, 50, 140);

  const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 240);
  camera.position.set(0, 4.2, 7.5);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8bd17c, 0.75));
  const sunLight = new THREE.DirectionalLight(0xfff1d0, 0.65);
  sunLight.position.set(-5, 10, 6);
  scene.add(sunLight);

  const lambert = (color) => new THREE.MeshLambertMaterial({ color });

  function canvasTexture(w, h, draw) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.anisotropy = 4;
    return t;
  }

  // ---------- static ground ----------
  const grass = new THREE.Mesh(new THREE.PlaneGeometry(200, 260), lambert(0x7fd36b));
  grass.rotation.x = -Math.PI / 2;
  grass.position.set(0, -0.02, -100);
  scene.add(grass);

  const track = new THREE.Mesh(new THREE.PlaneGeometry(8.4, 260), lambert(0xe8c48f));
  track.rotation.x = -Math.PI / 2;
  track.position.set(0, 0, -100);
  scene.add(track);

  const railMat = lambert(0xb7b9d6);
  for (const lx of LANES) {
    for (const side of [-0.55, 0.55]) {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 260), railMat);
      rail.position.set(lx + side, 0.12, -100);
      scene.add(rail);
    }
  }

  // ---------- moving things (recycled) ----------
  const tieMat = lambert(0xa0704a);
  const tieGeo = new THREE.BoxGeometry(8, 0.08, 0.5);
  const ties = [];
  const TIE_GAP = 2.5;
  for (let i = 0; i < 50; i++) {
    const tie = new THREE.Mesh(tieGeo, tieMat);
    tie.position.set(0, 0.04, DESPAWN_Z - i * TIE_GAP);
    scene.add(tie);
    ties.push(tie);
  }

  const houseColors = [0xff8fa3, 0xffd23f, 0x9b8cff, 0x5ec8e5, 0xffa45c, 0xf7f7ff];
  const roofMat = lambert(0xe2475e);
  const trunkMat = lambert(0x8a5a36);
  const leafMats = [lambert(0x3fae5a), lambert(0x58c46e)];
  const scenery = [];
  function makeTree() {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.3, 1.4, 8), trunkMat);
    trunk.position.y = 0.7;
    const top = new THREE.Mesh(new THREE.SphereGeometry(1.2, 10, 8), leafMats[Math.random() < 0.5 ? 0 : 1]);
    top.position.y = 2.2;
    g.add(trunk, top);
    return g;
  }
  function makeHouse() {
    const g = new THREE.Group();
    const w = 3 + Math.random() * 2, h = 2.5 + Math.random() * 3;
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, 3), lambert(houseColors[Math.floor(Math.random() * houseColors.length)]));
    body.position.y = h / 2;
    const roof = new THREE.Mesh(new THREE.ConeGeometry(w * 0.8, 1.6, 4), roofMat);
    roof.position.y = h + 0.8;
    roof.rotation.y = Math.PI / 4;
    g.add(body, roof);
    return g;
  }
  const sceneryMat = (c) => lambert(c);
  const petalColors = [0xff5d73, 0xffd23f, 0xffffff, 0x9b8cff, 0xff8fd8];
  function makeBush() {
    const g = new THREE.Group();
    const m = leafMats[1];
    for (const [x, y, r] of [[0, 0.45, 0.55], [0.5, 0.35, 0.4], [-0.45, 0.32, 0.38]]) {
      const b = new THREE.Mesh(new THREE.SphereGeometry(r, 8, 6), m);
      b.position.set(x, y, 0);
      g.add(b);
    }
    g.userData.near = true;
    return g;
  }
  function makeFlowers() {
    const g = new THREE.Group();
    const stem = sceneryMat(0x2f9e44);
    for (let i = 0; i < 7; i++) {
      const x = (Math.random() - 0.5) * 2.2, z = (Math.random() - 0.5) * 2.2;
      const st = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.4, 4), stem);
      st.position.set(x, 0.2, z);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.14, 6, 5), sceneryMat(petalColors[Math.floor(Math.random() * petalColors.length)]));
      head.position.set(x, 0.42, z);
      g.add(st, head);
    }
    g.userData.near = true;
    return g;
  }
  function makeLamp() {
    const g = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 3, 6), sceneryMat(0x2b2350));
    pole.position.y = 1.5;
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.25, 10, 8), new THREE.MeshBasicMaterial({ color: 0xfff3b0 }));
    bulb.position.y = 3.1;
    g.add(pole, bulb);
    g.userData.near = true;
    return g;
  }
  const spinners = [];
  function makeWindmill() {
    const g = new THREE.Group();
    const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 1.1, 5, 8), sceneryMat(0xf7f7ff));
    tower.position.y = 2.5;
    const cap = new THREE.Mesh(new THREE.ConeGeometry(0.85, 1.1, 8), roofMat);
    cap.position.y = 5.5;
    const hub = new THREE.Group();
    hub.position.set(0, 4.6, 0.9);
    const bladeMat = sceneryMat(0xffd23f);
    for (let i = 0; i < 4; i++) {
      const blade = new THREE.Mesh(new THREE.BoxGeometry(0.4, 2.4, 0.06), bladeMat);
      blade.position.y = 1.2;
      const arm = new THREE.Group();
      arm.rotation.z = i * Math.PI / 2;
      arm.add(blade);
      hub.add(arm);
    }
    g.add(tower, cap, hub);
    spinners.push(hub);
    return g;
  }
  const balloonColors = [0xff5d73, 0xffd23f, 0x5ec8e5, 0x9b5de5];
  function makeBalloon() {
    const g = new THREE.Group();
    const ball = new THREE.Mesh(new THREE.SphereGeometry(1.1, 14, 12), sceneryMat(balloonColors[Math.floor(Math.random() * balloonColors.length)]));
    ball.scale.y = 1.2;
    ball.position.y = 7.5 + Math.random() * 3;
    const basket = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.5), trunkMat);
    basket.position.y = ball.position.y - 1.8;
    g.add(ball, basket);
    g.userData.far = true;
    return g;
  }
  const kinds = [makeTree, makeTree, makeHouse, makeTree, makeBush, makeFlowers, makeLamp, makeHouse, makeFlowers, makeBush, makeTree, makeWindmill, makeTree, makeFlowers, makeHouse, makeBalloon];
  function placeScenery(obj, z) {
    const side = obj.userData.side;
    const u = obj.userData;
    const dist = u.near ? 5 + Math.random() * 1.8 : u.far ? 10 + Math.random() * 14 : 7.5 + Math.random() * 6;
    obj.position.set(side * dist, 0, z);
  }
  const SCENERY_GAP = 2.2;
  for (let i = 0; i < 56; i++) {
    const obj = kinds[i % kinds.length]();
    obj.userData.side = i % 2 === 0 ? -1 : 1;
    if (obj.userData.near === undefined && obj.userData.far === undefined) obj.userData.mid = true;
    placeScenery(obj, DESPAWN_Z - i * SCENERY_GAP);
    scene.add(obj);
    scenery.push(obj);
  }

  // little white fences along both sides of the track
  const fenceMat = sceneryMat(0xffffff);
  const fences = [];
  const FENCE_GAP = 2;
  for (let i = 0; i < 60; i++) {
    for (const side of [-1, 1]) {
      const f = new THREE.Group();
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.7, 0.12), fenceMat);
      post.position.y = 0.35;
      const bar = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.1, FENCE_GAP), fenceMat);
      bar.position.set(0, 0.5, -FENCE_GAP / 2);
      f.add(post, bar);
      f.position.set(side * 4.45, 0, DESPAWN_Z - i * FENCE_GAP);
      scene.add(f);
      fences.push(f);
    }
  }

  // far away: rolling hills, the sun, drifting clouds (these ignore the fog)
  const hillMats = [lambert(0x5cc46e), lambert(0x4bb36a), lambert(0x6fd07a)];
  for (let i = 0; i < 14; i++) {
    const side = i % 2 === 0 ? -1 : 1;
    const r = 14 + Math.random() * 12;

  function slab(len, thick, mat, y0, y1, z0, z1) {

    g.add(slab(0, 0.18, rampMat, 0, height, 0, -ramp));

    if (down) g.add(slab(0, 0.18, rampMat, height, 0, -ramp - deck, -2 * ramp - deck));
    for (let z = -ramp - 1; z > -ramp - deck; z -= 3.5) {

    return g;
  }

  // height of a platform's surface, d units past its near end
  function surfaceAt(p, d) {
    const u = p.userData;
    if (d < 0 || d > u.length) return 0;
    if (d < u.ramp) return u.height * d / u.ramp;
    if (d <= u.ramp + u.deck) return u.height;
    return u.height * (1 - (d - u.ramp - u.deck) / u.ramp);
  }

  const s = {

  function renderHud() {

  function teleport() {

  function reset() {

  // first stumble: she trips and the policeman nearly catches her; a second one while he's close: caught!

  // ---------- input ----------

  function jump() {

  function primaryAction() {

  let touch = null;
  const SWIPE_PX = 28;
  const soundBtn = document.getElementById('soundBtn');
  function renderSoundBtn() {

  renderSoundBtn();
  soundBtn.addEventListener('pointerdown', (e) => {

  soundBtn.addEventListener('click', (e) => e.preventDefault());
  window.addEventListener('pointerdown', (e) => {
    e.preventDefault();

  }, { passive: false });

  window.addEventListener('keydown', (e) => {

  // ---------- spawning ----------
  function laneBusy(li, margin = 10) {
    // a lane is busy while a platform in it still reaches back past the spawn line
    return platforms.some(p => p.userData.lane === li && p.position.z - p.userData.length < SPAWN_Z + margin);
  }
  // trains need a long run-up after a bridge so she has time to see them and move
  const tallFree = () => [0, 1, 2].filter(li => !laneBusy(li, 35));
  function addObstacle(o, li, z, base = 0) {
    o.position.set(LANES[li], base, z);
    o.userData.base = base;
    scene.add(o);
    obstacles.push(o);
  }
  function addPlatform(p, li) {
    p.position.set(LANES[li], 0, SPAWN_Z);
    p.userData.lane = li;
    scene.add(p);
    platforms.push(p);
  }
  function bridgeOpts(rails) {
    return { ramp: 4.5, height: 1.8, deck: 10 + Math.random() * 14, down: Math.random() < 0.6, rails };
  }
  function spawnStuff(free) {
    const r = Math.random();
    if (r < 0.25 && free.length === 3) {
      // a big bridge across all three lanes
      const opts = bridgeOpts([]);
      for (const li of [0, 1, 2]) {
        opts.rails = li === 0 ? [-1] : li === 2 ? [1] : [];
        addPlatform(makeBridge(opts), li);
      }
      coinLine(Math.floor(Math.random() * 3), SPAWN_Z - opts.ramp - 1, Math.floor(opts.deck / 2.2), opts.height + 0.8, 2.2);
    } else if (r < 0.6) {
      const li = free[Math.floor(Math.random() * free.length)];
      const b = makeBridge(bridgeOpts([-1, 1]));
      addPlatform(b, li);
      // sometimes a hay bale up on the deck to hop over
      const u = b.userData;
      if (u.deck > 14 && Math.random() < 0.5) {
        const hz = SPAWN_Z - u.ramp - u.deck * 0.6;
        addObstacle(makeHay(), li, hz, u.height);
        coinArc(li, hz, u.height);
      } else {
        coinLine(li, SPAWN_Z - u.ramp - 1, Math.floor(u.deck / 2.2), u.height + 0.8, 2.2);
      }
    } else if (r < 0.8) {
      const li = free[Math.floor(Math.random() * free.length)];
      addPlatform(makeLaunchRamp(), li);
      for (let k = 0; k < 7; k++) addCoin(li, SPAWN_Z - 4 - k * 1.8, 2.0 + Math.sin(k / 6 * Math.PI) * 1.6);
    } else {
      for (const li of free) {
        if (Math.random() < 0.6 || li === free[0]) {
          addObstacle(makePad(), li, SPAWN_Z);
          coinLine(li, SPAWN_Z - 3, 6, 3.6, 1.8); // up high, only reachable with a bounce
        }
      }
    }
  }
  function spawnRow() {
    const free = [0, 1, 2].filter(li => !laneBusy(li));
    if (s.distance > s.nextPortal && tallFree().length === 3) {
      // the portal gets a row all to itself, in a random lane
      addObstacle(makePortal(), Math.floor(Math.random() * 3), SPAWN_Z);
      s.nextPortal = Infinity;
      s.untilNext = 40;
      return;
    }
    if (free.length && s.distance > 30 && Math.random() < 0.35) {
      spawnStuff(free);
    } else if (s.distance > 20 && !s.lastTall && Math.random() < 0.4 && tallFree().length) {
      // one or two train carriages; at least one lane always stays open
      const lanes = tallFree().sort(() => Math.random() - 0.5).slice(0, Math.random() < 0.6 ? 1 : 2);
      for (const li of lanes) addObstacle(makeTrainCar(), li, SPAWN_Z - 3);
      const open = [0, 1, 2].filter(li => !lanes.includes(li));
      coinLine(open[Math.floor(Math.random() * open.length)], SPAWN_Z, 5, 0.8);
      s.lastTall = true;
      s.untilNext = s.speed * 2.0 + Math.random() * s.speed * 0.6 + 6;
      return;
    } else if (free.length) {
      const r = Math.random();
      let count = r < 0.5 ? 1 : r < 0.85 ? 2 : 3;
      if (s.distance < 150) count = Math.min(count, 2);
      const lanes = free.sort(() => Math.random() - 0.5).slice(0, count);
      for (const li of lanes) addObstacle(makers[Math.floor(Math.random() * makers.length)](), li, SPAWN_Z);
      if (Math.random() < 0.75) {
        const li = free[Math.floor(Math.random() * free.length)];
        if (lanes.includes(li)) coinArc(li, SPAWN_Z);
        else coinLine(li, SPAWN_Z + 3, 5, 0.8);
      }
      const open = free.filter(li => !lanes.includes(li));
      if (s.distance > s.nextBoard && s.board <= 0 && open.length) {
        addObstacle(makeBoardPickup(), open[0], SPAWN_Z - 4);
        s.nextBoard = s.distance + 150 + Math.random() * 120;
      }
    }
    s.lastTall = false;

    s.untilNext = s.speed * 1.5 + Math.random() * s.speed * 0.9;
  }

  // ---------- loop ----------
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // keep all three lanes in view on a tall portrait screen
    camera.fov = w / h < 0.8 ? 72 : 60;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  function update(dt) {
    const running = s.mode === 'running';
    const crashed = s.mode === 'crashed';

    if (running) {
      s.speed = Math.min(MAX_SPEED, s.speed + SPEED_RAMP * dt);
      s.distance += s.speed * dt * 0.5;
    } else if (crashed) {
      s.speed = Math.max(0, s.speed - 40 * dt);
      s.crashT += dt;
      if (s.crashT > 0.7 && crashScreen.hidden) crashScreen.hidden = false;
    } else {
      s.speed = 4; // gentle jog behind the start screen
    }
    const move = s.speed * dt;

    // lanes: smooth slide
    s.x += (LANES[s.lane] - s.x) * Math.min(1, dt * 14);

    // what is she standing over? (checked after the world moves, below)
    const wasGrounded = s.y <= s.ground + 0.02 && s.vy <= 0;
    const prevGround = s.ground, prevPlat = s.groundPlat;

    // world scroll
    for (const t of ties) {
      t.position.z += move;
      if (t.position.z > DESPAWN_Z) t.position.z -= ties.length * TIE_GAP;
    }
    for (const o of scenery) {
      o.position.z += move;
      if (o.position.z > DESPAWN_Z) placeScenery(o, o.position.z - scenery.length * SCENERY_GAP);
    }
    for (const f of fences) {
      f.position.z += move;
      if (f.position.z > DESPAWN_Z) f.position.z -= (fences.length / 2) * FENCE_GAP;
    }
    for (const c of clouds) {
      c.position.z += move * 0.04;
      c.position.x += dt * 0.6;
      if (c.position.z > -30) c.position.z -= 120;
      if (c.position.x > 80) c.position.x = -80;
    }
    for (const h of spinners) h.rotation.z += dt * 1.5;
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.position.z += move;
      if (o.position.z > DESPAWN_Z) { scene.remove(o); obstacles.splice(i, 1); continue; }
      if (running) {
        const d = o.userData;
        const hitX = Math.abs(o.position.x - s.x) < d.halfW + 0.22;
        const hitZ = Math.abs(o.position.z) < d.halfD + 0.18;
        const feet = s.y - d.base;
        if (d.portal) {
          if (hitX && Math.abs(o.position.z) < 0.6) { teleport(); break; }
        } else if (d.boardPickup) {
          if (hitX && Math.abs(o.position.z) < 0.8 && feet < 2.2) {
            scene.remove(o); obstacles.splice(i, 1);
            setBoard(20);
            sfx.boardGet();
            toast('Hoverboard!');
            continue;
          }
        } else if (d.pad) {
          if (hitX && hitZ && feet < 0.4 && feet > -0.3 && s.vy <= 0) { s.vy = 15; d.top.position.y = 0.32; sfx.bounce(); }
        } else if (d.tall && hitX && hitZ && Math.abs(o.position.z) < d.halfD - 0.4) {
          s.lane = s.prevLane; // swiped into the side of a train: bump back instead of crashing
          stumble();
        } else if (hitX && hitZ && feet < d.height - 0.12 && feet > -0.5) {
          // tripped over something jumpable: knock it flying and stumble
          scene.remove(o); obstacles.splice(i, 1);
          stumble();
          continue;
        }
      }
      if (o.userData.portal) { o.userData.swirl.rotation.z -= dt * 4; }
      if (o.userData.boardPickup) { o.userData.spin.rotation.y += dt * 2; o.userData.ring.rotation.y += dt * 2; }
      if (o.userData.pad) o.userData.top.position.y += (0.2 - o.userData.top.position.y) * Math.min(1, dt * 8);
    }
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i];
      c.position.z += move;
      c.rotation.y += dt * 4;
      if (c.position.z > DESPAWN_Z) { scene.remove(c); coins.splice(i, 1); continue; }
      if (running && Math.abs(c.position.x - s.x) < 0.9 && Math.abs(c.position.z) < 0.8 && Math.abs(c.position.y - (s.y + 0.9)) < 1.2) {
        scene.remove(c); coins.splice(i, 1);
        s.coins++;
        popCoins();
        sfx.coin();
      }
    }
    let copGround = 0;
    s.ground = 0; s.groundPlat = null;
    for (let i = platforms.length - 1; i >= 0; i--) {
      const p = platforms[i];
      p.position.z += move;
      if (p.position.z - p.userData.length > DESPAWN_Z) { scene.remove(p); platforms.splice(i, 1); continue; }
      if (Math.abs(p.position.x - s.x) < 1.0) {
        const h = surfaceAt(p, p.position.z);
        if (h > s.ground) { s.ground = h; s.groundPlat = p; }
      }
      if (Math.abs(p.position.x - s.copX) < 1.0) copGround = Math.max(copGround, surfaceAt(p, p.position.z - s.copZ));
    }

    // jumping, falling, and riding up ramps
    if (wasGrounded && s.ground < prevGround - 0.05 && prevPlat && prevPlat.userData.launch && running) {
      s.vy = 8.5; // whoosh off the launch ramp
      sfx.launch();
    }
    if (s.jumpBuffer > 0) {
      s.jumpBuffer -= dt;
      if (s.y <= s.ground + 0.02 && s.vy <= 0 && running) { s.vy = JUMP_V; s.jumpBuffer = 0; sfx.jump(); }
    }
    if (wasGrounded && s.vy <= 0 && s.ground < s.y && s.y - s.ground < 0.35 && !(prevPlat && prevPlat.userData.launch)) {
      s.y = s.ground; // walk down a ramp instead of floating off it
    }
    if (s.y > s.ground || s.vy > 0) {
      s.vy -= GRAVITY * dt;
      s.y += s.vy * dt;
    }
    if (s.y <= s.ground) {
      // ramps push her up; stepping sideways onto a bridge lifts her quickly but gently
      s.y = s.ground - s.y > 0.3 ? s.y + (s.ground - s.y) * Math.min(1, dt * 18) : s.ground;
      if (s.vy < 0) s.vy = 0;
    }

    if (running) {
      s.untilNext -= move;
      if (s.untilNext <= 0) spawnRow();
    }

    // hoverboard timer
    if (s.invuln > 0) s.invuln -= dt;
    if (s.board > 0 && running) {
      s.board -= dt;
      boardPill.lastChild.nodeValue = Math.ceil(s.board);
      boardPill.classList.toggle('low', s.board < 4);
      if (s.board <= 0) setBoard(0);
    }
    const onBoard = s.board > 0;
    player.visible = s.invuln <= 0 || Math.floor(s.invuln * 10) % 2 === 0; // blink while safe

    // runner pose
    s.runPhase += dt * (6 + s.speed * 0.6);
    const air = s.y > s.ground + 0.05;
    const swing = onBoard ? Math.sin(s.runPhase * 0.3) * 0.15 : air ? 0.9 : Math.sin(s.runPhase) * 0.9;
    legL.rotation.x = onBoard ? 0.15 : air ? -0.9 : swing;
    legR.rotation.x = onBoard ? -0.15 : air ? 0.5 : -swing;
    armL.rotation.x = onBoard ? 0.3 + swing : air ? 2.4 : -swing;
    armR.rotation.x = onBoard ? 0.3 - swing : air ? 2.4 : swing;
    armL.rotation.z = onBoard ? -0.9 : 0; // arms out for balance on the board
    armR.rotation.z = onBoard ? 0.9 : 0;
    const hover = onBoard ? 0.32 + Math.sin(performance.now() / 180) * 0.05 : 0;
    riding.rotation.z = onBoard ? (LANES[s.lane] - s.x) * 0.25 : 0;
    player.position.set(s.x, s.y + hover + (air || onBoard ? 0 : Math.abs(Math.sin(s.runPhase)) * 0.08), 0);
    player.rotation.y = (LANES[s.lane] - s.x) * -0.15;
    if (crashed) {
      player.rotation.x = Math.min(1.4, s.crashT * 4);
    } else if (s.stumbleT > 0) {
      s.stumbleT -= dt;
      player.rotation.x = Math.sin((0.5 - s.stumbleT) / 0.5 * Math.PI) * -0.6; // a wobbly trip forward
      player.rotation.z = Math.sin(s.stumbleT * 30) * 0.15;
    } else {
      player.rotation.x = 0;
      player.rotation.z = 0;
    }
    // every so often she glances back over her shoulder at the policeman, so we see her face
    const canLook = !air && s.stumbleT <= 0 && s.mode !== 'crashed';
    s.nextLook -= dt;
    if (s.lookT <= 0 && s.nextLook <= 0 && canLook) {
      s.lookT = 1.2;
      s.nextLook = (s.copClose > 0 ? 1.8 : 4) + Math.random() * 3;
    }
    let look = 0;
    if (s.lookT > 0) {
      s.lookT -= dt;
      const prog = 1 - s.lookT / 1.2;
      look = Math.min(1, Math.sin(prog * Math.PI) * 1.8);
    }
    if (s.mode === 'crashed' && s.caught) look = Math.min(1, s.crashT * 2); // turns round to face him
    const lookSide = s.copX > s.x ? -1 : 1; // over the shoulder nearest the policeman
    headPivot.rotation.y = lookSide * 2.4 * look;
    headPivot.rotation.x = -0.1 * look;
    upperBody.rotation.y = lookSide * 0.3 * look;
    // blink now and then
    s.blinkT -= dt;
    if (s.blinkT <= 0) s.blinkT = 2.5 + Math.random() * 3;
    const eyeY = s.blinkT < 0.12 ? 0.15 : 1;
    eyes[0].scale.y = eyes[1].scale.y = eyeY;
    // ponytail bounces with each step and flies up in the air
    pony.rotation.x = air ? -0.7 : 0.25 + Math.sin(s.runPhase * 2) * 0.25;
    pony.rotation.z = Math.sin(s.runPhase) * 0.2;

    blob.position.set(s.x, s.ground + 0.06, 0);
    const blobScale = 1 - Math.min(0.5, (s.y - s.ground) * 0.25);
    blob.scale.set(blobScale, blobScale, 1);

    // the policeman: right behind at the start and after a stumble, otherwise he falls back out of sight
    s.bumpCool -= dt;
    if (running) s.copClose = Math.max(0, s.copClose - dt);
    const copTarget = crashed ? 1.4 : s.mode === 'ready' ? 16 : s.copClose > 0 ? (s.stumbleT > 0 ? 1.0 : 1.9) : 16;
    s.copZ += (copTarget - s.copZ) * Math.min(1, dt * (s.copClose > 0 || crashed ? 2.5 : 0.6));
    // he runs just off her shoulder so he never hides her from view
    const copSide = s.x > 0.5 ? -1.5 : 1.5;
    s.copX += (s.x + copSide - s.copX) * Math.min(1, dt * 5);
    const copNear = obstacles.some(o => !o.userData.tall && !o.userData.portal && Math.abs(o.position.x - s.copX) < 1.2 && o.position.z - s.copZ > -2.5 && o.position.z - s.copZ < 0);
    if (copNear && s.copY <= copGround + 0.02) s.copVy = JUMP_V;
    s.copVy -= GRAVITY * dt;
    s.copY = Math.max(copGround, s.copY + s.copVy * dt);
    if (s.copY <= copGround) s.copVy = 0;
    const copAir = s.copY > copGround + 0.05;
    const copStill = crashed && s.speed < 0.5;
    const cs = copStill ? 0 : Math.sin(s.runPhase * 0.95) * 0.9;
    copLegL.rotation.x = copAir ? -0.9 : cs;
    copLegR.rotation.x = copAir ? 0.5 : -cs;
    copArmL.rotation.x = copStill ? 2.6 : -cs; // waving when he's caught up
    copArmR.rotation.x = copStill ? 0.3 * Math.sin(s.crashT * 8) : cs;
    cop.position.set(s.copX, s.copY, s.copZ);
    cop.visible = s.copZ < 12;

    // camera follows lane a little
    camera.position.x += (s.x * 0.55 - camera.position.x) * Math.min(1, dt * 6);
    camera.position.y += (4.2 + s.y * 0.7 - camera.position.y) * Math.min(1, dt * 5);
    camera.lookAt(s.x * 0.4, 1.2 + s.y * 0.6, -6);

    if (running) renderHud();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => { last = performance.now(); });
  renderHud();
  requestAnimationFrame(frame);

  // test hook
  window.__hop = s;
  window.__hopWorld = () => ({ obstacles, platforms, LANES });
})();
</script>
